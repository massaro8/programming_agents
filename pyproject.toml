[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentready"
version = "0.1.0"
description = "Detachable, vendor-neutral repository engineering layer for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
dependencies = [
    "copier>=9.18.2,<10",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/massaro8/programming_agents"
Issues = "https://github.com/massaro8/programming_agents/issues"
Documentation = "https://github.com/massaro8/programming_agents#readme"

[project.scripts]
agentready = "agentready.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentready"]

[tool.hatch.build.targets.sdist]
include = ["/src/agentready", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/agentready/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["src/agentready/templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
