name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} ruff format --check .
      - run: uv run --python ${{ matrix.python }} ruff check .
      - run: uv run --python ${{ matrix.python }} mypy src
      # Serial tests avoid Windows installed-launcher contention. Pytest reports privilege skips.
      - run: uv run --python ${{ matrix.python }} pytest
      - run: uv build
      - run: uv run --python ${{ matrix.python }} python scripts/generate_codebase_map.py --check
