name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cfn-lint==1.57.2
      - name: Install pinned official Guard binary
        run: |
          curl --fail --location --output guard.tar.gz https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz
          echo '09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94  guard.tar.gz' | sha256sum --check
          tar -xzf guard.tar.gz
          echo "$PWD/cfn-guard-v3-x86_64-ubuntu-latest" >> "$GITHUB_PATH"
      - run: python scripts/project.py verify
