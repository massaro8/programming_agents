AWSTemplateFormatVersion: '2010-09-09'
Description: Synthetic private artifact storage for offline engineering experiments only.
Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, test]
Resources:
  Storage:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Private versioned artifact storage; synthetic and never deployed.
        must: [Encryption, Public access blocked, Retention, TLS only]
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
  StoragePolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Reject plaintext transport to the artifact bucket.
        must: [Keep explicit transport deny]
    Properties:
      Bucket: !Ref Storage
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt Storage.Arn
              - !Sub '${Storage.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  ArtifactBucket:
    Value: !Ref Storage
  ArtifactBucketArn:
    Description: ARN of the local artifact bucket; no cross-stack export.
    Value: !GetAtt Storage.Arn
